<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>NEXT OCR</title>
<link rel="icon" href="next_logo.png">
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://unpkg.com/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.4.0/exceljs.min.js"></script>
<style>
:root{
  --bg:#f6f7f9; --surface:#fff; --surface-2:#fbfcfd; --border:#e3e6ea;
  --text:#15181d; --muted:#6b7280; --accent:#4f46e5; --accent-soft:#eef2ff;
  --ok:#0f8a5f; --ok-soft:#e7f6ef; --warn:#b45309; --warn-soft:#fef4e6;
  --err:#c62828; --err-soft:#fdeced;
  --radius:12px; --shadow:0 1px 2px rgba(16,24,40,.05),0 4px 16px rgba(16,24,40,.06);
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#0d1013; --surface:#15191e; --surface-2:#1a1f25; --border:#272e36;
    --text:#e8eaed; --muted:#98a2ae; --accent:#8b87f5; --accent-soft:#1e1f3d;
    --ok:#4ade80; --ok-soft:#10251c; --warn:#fbbf24; --warn-soft:#2a2010;
    --err:#f87171; --err-soft:#2c1416;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 16px rgba(0,0,0,.25);
  }
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0; background:var(--bg); color:var(--text);
  font:15px/1.55 ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  -webkit-font-smoothing:antialiased;
}
button{font:inherit;color:inherit;cursor:pointer}
h1,h2,h3{margin:0;font-weight:600;letter-spacing:-.01em}

/* ---------- shell ---------- */
.app{display:flex;flex-direction:column;height:100vh}
header{
  display:flex;align-items:center;gap:14px;padding:14px 22px;
  background:var(--surface);border-bottom:1px solid var(--border);flex:none;
}
.logo{
  width:44px;height:44px;border-radius:9px;flex:none;display:block;
  object-fit:contain;
}
.brand h1{font-size:15px}
.brand p{margin:0;font-size:12.5px;color:var(--muted)}
header .spacer{flex:1}

.btn{
  border:1px solid var(--border);background:var(--surface);padding:8px 14px;
  border-radius:9px;font-size:13.5px;font-weight:500;
  display:inline-flex;align-items:center;gap:7px;transition:.15s;
}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{filter:brightness(1.08);color:#fff}
.btn.ghost{border-color:transparent;background:transparent;color:var(--muted)}
.btn.ghost:hover{background:var(--surface-2);color:var(--text)}
.btn:disabled{opacity:.45;cursor:not-allowed;border-color:var(--border);color:var(--muted)}
.btn.sm{padding:5px 10px;font-size:12.5px;border-radius:7px}

/* ---------- upload (sidebar) ---------- */
#drop{
  border:2px dashed var(--border);border-radius:14px;background:var(--surface);
  padding:22px 14px;text-align:center;transition:.18s;cursor:pointer;flex:none;
}
#drop:hover,#drop.over{border-color:var(--accent);background:var(--accent-soft)}
#drop.over{transform:scale(1.01)}
.drop-ico{
  width:38px;height:38px;margin:0 auto 10px;border-radius:11px;
  display:grid;place-items:center;background:var(--accent-soft);color:var(--accent);
}
#drop strong{display:block;font-size:14px;margin-bottom:4px}
#drop span{color:var(--muted);font-size:12px}
.side-opt{
  display:flex;align-items:flex-start;gap:7px;font-size:12.5px;color:var(--muted);
  padding:12px 4px 0;cursor:pointer;line-height:1.4;
}
.side-opt input{accent-color:var(--accent);width:15px;height:15px;cursor:pointer;flex:none;margin-top:1px}
.side-msg{font-size:12.5px;margin:10px 4px 0}
.side-msg:empty{display:none}

/* ---------- settings ---------- */
.settings{
  margin-top:auto;padding:12px 14px;border:1px solid var(--border);
  border-radius:var(--radius);background:var(--surface);text-align:left;flex:none;
}
.settings summary{cursor:pointer;font-size:12.5px;color:var(--muted);font-weight:500}
.settings summary:hover{color:var(--text)}
.settings .row{display:flex;gap:8px;margin-top:12px}
.settings input{
  flex:1;padding:8px 11px;border:1px solid var(--border);border-radius:8px;
  background:var(--bg);color:var(--text);font:13px ui-monospace,Consolas,monospace;
}
.settings input:focus{outline:2px solid var(--accent);outline-offset:-1px;border-color:transparent}
.hint{font-size:12px;color:var(--muted);margin:9px 0 0}

/* ---------- workspace ---------- */
.work{flex:1;display:grid;grid-template-columns:300px 1fr;min-height:0}
aside{
  background:var(--surface);border-right:1px solid var(--border);
  padding:16px;overflow:auto;display:flex;flex-direction:column;gap:4px;
}
.aside-h{
  font-size:11px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;
  color:var(--muted);padding:20px 4px 9px;
}
.doc-item{
  width:100%;text-align:left;border:1px solid transparent;background:transparent;
  padding:9px 10px;border-radius:9px;margin-bottom:3px;transition:.13s;
}
.doc-item:hover{background:var(--surface-2)}
.doc-item.active{background:var(--accent-soft);border-color:var(--accent)}
.doc-item .nm{
  font-size:13px;font-weight:500;white-space:nowrap;overflow:hidden;
  text-overflow:ellipsis;display:block;
}
.doc-item .mt{font-size:11.5px;color:var(--muted);display:block;margin-top:2px}

main{overflow:auto;padding:20px 24px;min-width:0}
.empty-state{
  height:100%;display:grid;place-items:center;text-align:center;color:var(--muted);
  padding:40px 20px;
}
.empty-state .ico{
  width:52px;height:52px;margin:0 auto 16px;border-radius:14px;
  display:grid;place-items:center;background:var(--accent-soft);color:var(--accent);
}
.empty-state strong{display:block;font-size:16.5px;color:var(--text);margin-bottom:5px}
.empty-state p{margin:0;font-size:13.5px;max-width:320px}

.doc-head{display:flex;flex-wrap:wrap;align-items:center;gap:12px;margin-bottom:6px}
.doc-head h2{font-size:19px;word-break:break-all}
.meta{display:flex;flex-wrap:wrap;gap:7px;margin:10px 0 18px}
.tag{
  font-size:12px;padding:3px 9px;border-radius:999px;
  background:var(--surface-2);border:1px solid var(--border);color:var(--muted);
}
.tag.ok{background:var(--ok-soft);border-color:transparent;color:var(--ok);font-weight:500}
.tag.warn{background:var(--warn-soft);border-color:transparent;color:var(--warn);font-weight:500}
.tag.err{background:var(--err-soft);border-color:transparent;color:var(--err);font-weight:500}
.actions{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:18px}

/* ---------- progress ---------- */
.prog{
  background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);
  padding:20px;box-shadow:var(--shadow);
}
.prog .lbl{display:flex;justify-content:space-between;font-size:13.5px;margin-bottom:10px}
.prog .lbl b{font-weight:500}
.prog .lbl span{color:var(--muted)}
.bar{height:6px;background:var(--border);border-radius:99px;overflow:hidden}
.bar i{
  display:block;height:100%;background:var(--accent);border-radius:99px;
  transition:width .35s ease;
}
.spin{
  width:14px;height:14px;border:2px solid var(--border);border-top-color:var(--accent);
  border-radius:50%;animation:sp .7s linear infinite;display:inline-block;vertical-align:-2px;
}
@keyframes sp{to{transform:rotate(360deg)}}

/* ---------- results ---------- */
.panes{display:grid;grid-template-columns:1fr 1fr;gap:18px;align-items:start}
.pane{
  background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);
  box-shadow:var(--shadow);overflow:hidden;display:flex;flex-direction:column;
}
.pane-h{
  display:flex;align-items:center;gap:8px;padding:10px 14px;
  border-bottom:1px solid var(--border);background:var(--surface-2);flex:none;
}
.pane-h h3{font-size:13px;font-weight:600}
.pane-h .spacer{flex:1}
.pane iframe{width:100%;height:calc(100vh - 290px);min-height:440px;border:0;background:#fff}

.tabs{display:flex;gap:2px}
.tab{
  border:0;background:transparent;padding:5px 11px;border-radius:7px;
  font-size:12.5px;color:var(--muted);font-weight:500;
}
.tab:hover{background:var(--border)}
.tab.on{background:var(--accent);color:#fff}
.tab-body{overflow:auto;height:calc(100vh - 290px);min-height:440px;padding:0}

.page-block{border-bottom:1px solid var(--border)}
.page-block:last-child{border-bottom:0}
.page-bar{
  display:flex;align-items:center;gap:9px;padding:8px 14px;
  background:var(--surface-2);position:sticky;top:0;z-index:1;
  border-bottom:1px solid var(--border);
}
.page-bar .n{font-size:12px;font-weight:600;color:var(--muted);letter-spacing:.03em}
.page-bar .spacer{flex:1}
.page-block pre{
  margin:0;padding:14px 16px;white-space:pre-wrap;word-break:break-word;
  font:12.5px/1.65 ui-monospace,"Cascadia Code",Consolas,monospace;tab-size:4;
}
.page-block pre.empty{color:var(--muted);font-style:italic}

table.kv{width:100%;border-collapse:collapse;font-size:13px}
table.kv td{padding:8px 16px;border-bottom:1px solid var(--border)}
table.kv td:first-child{color:var(--muted);width:45%}
table.kv td:last-child{font-family:ui-monospace,Consolas,monospace;font-size:12.5px}

.banner{
  display:flex;gap:10px;align-items:flex-start;padding:12px 14px;
  border-radius:10px;font-size:13.5px;margin-bottom:16px;
}
.banner.info{background:var(--accent-soft);color:var(--accent)}
.banner.err{background:var(--err-soft);color:var(--err)}
.banner b{display:block;margin-bottom:2px}

@media (max-width:1080px){
  .panes{grid-template-columns:1fr}
  .pane iframe,.tab-body{height:60vh}
}
@media (max-width:760px){
  .work{grid-template-columns:1fr;grid-template-rows:auto 1fr}
  aside{border-right:0;border-bottom:1px solid var(--border);max-height:44vh}
  main{padding:16px}
}
</style>
</head>
<body>
<div class="app">

<header>
  <img class="logo" src="next_logo.png" alt="NEXT OCR">
  <div class="brand">
    <h1>NEXT OCR</h1>
    <p>Reconnaissance de texte automatique</p>
  </div>
  <div class="spacer"></div>
</header>

<div class="work" id="view-work">
  <aside>
    <div id="drop" tabindex="0" role="button" aria-label="Déposer un document">
      <div class="drop-ico">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
          <path d="M7 10l5-5 5 5"/><path d="M12 5v13"/>
        </svg>
      </div>
      <strong>Déposez vos documents</strong>
      <span>PDF, JPG, PNG, TIFF — ou cliquez</span>
    </div>
    <input type="file" id="file" accept=".pdf,image/*" multiple hidden>

    <label class="side-opt">
      <input type="checkbox" id="opt-force">
      Forcer l'OCR sur les PDF déjà textuels
    </label>

    <p class="side-msg" id="landing-msg"></p>

    <div class="aside-h">Documents</div>
    <div id="doclist"></div>

    <details class="settings" id="settings">
      <summary>⚙ Configuration du service OCR</summary>
      <div class="row">
        <input type="url" id="hook" placeholder="https://votre-serveur/api/ocr" spellcheck="false">
        <button class="btn sm" id="hook-save">Enregistrer</button>
      </div>
      <p class="hint">URL du point d'accès de traitement OCR.
        Enregistrée dans ce navigateur uniquement.</p>
    </details>
  </aside>
  <main id="detail"></main>
</div>

</div>

<script>
/* ============================================================
   Configuration
   ============================================================ */
const WEBHOOK_URL = 'https://ocr.4prod.tn/webhook/ocr';   // point d'accès de traitement OCR
const TARGET_WIDTH  = 1600;       // largeur de rendu des pages (px)
const MAX_BYTES     = 950 * 1024; // marge sous la limite d'envoi de 1 Mo
const NATIVE_MIN_CHARS = 120;     // seuil de détection d'une couche texte existante
const MAX_EXPORT_BYTES = 10 * 1024 * 1024; // marge sous la charge utile n8n (16 Mo, +33 % en base64)

const $ = s => document.querySelector(s);
const hookUrl = () => (localStorage.getItem('ocrHook') || WEBHOOK_URL).trim();
// Même serveur que l'OCR, chemin « /export » : une seule case à configurer.
// La barre finale est retirée d'abord, sinon « …/ocr/ » donnerait « …/ocr/export ».
const toExportUrl = u => u.replace(/\/+$/, '').replace(/\/[^/]*$/, '/export');
const exportUrl = () => toExportUrl(hookUrl());

/* ---------- pdf.js : worker via blob (fonctionne aussi en file://) ---------- */
const WORKER_SRC = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
let workerReady = fetch(WORKER_SRC)
  .then(r => r.blob())
  .then(b => { pdfjsLib.GlobalWorkerOptions.workerSrc = URL.createObjectURL(b); })
  .catch(() => { pdfjsLib.GlobalWorkerOptions.workerSrc = WORKER_SRC; });

/* ============================================================
   État
   ============================================================ */
const docs = [];      // {id,name,size,native,pages[],tab,pdfUrl,error}
let activeId = null;
let busy = false;

/* ============================================================
   Rendu d'une page en JPEG sous la limite de taille
   ------------------------------------------------------------
   Réduit qualité puis échelle jusqu'à passer sous MAX_BYTES.
   Renvoie une data URL — le préfixe `data:image/jpeg;base64,`
   est requis par l'API du service OCR.
   ============================================================ */
function canvasToJpeg(canvas) {
  for (const q of [0.82, 0.70, 0.58, 0.45]) {
    const url = canvas.toDataURL('image/jpeg', q);
    if (b64Bytes(url) <= MAX_BYTES) return url;
  }
  // dernier recours : on divise les dimensions par deux
  const half = document.createElement('canvas');
  half.width = Math.round(canvas.width / 2);
  half.height = Math.round(canvas.height / 2);
  const c = half.getContext('2d');
  c.fillStyle = '#fff'; c.fillRect(0, 0, half.width, half.height);
  c.drawImage(canvas, 0, 0, half.width, half.height);
  return half.toDataURL('image/jpeg', 0.7);
}
function b64Bytes(dataUrl) {
  const b64 = dataUrl.slice(dataUrl.indexOf(',') + 1);
  const pad = (b64.endsWith('==') ? 2 : b64.endsWith('=') ? 1 : 0);
  return Math.floor(b64.length * 3 / 4) - pad;
}

async function renderPdfPage(pdf, n, extraRotation = 0) {
  const page = await pdf.getPage(n);
  const rot = (page.rotate + extraRotation) % 360;
  const base = page.getViewport({ scale: 1, rotation: rot });
  const scale = Math.min(TARGET_WIDTH / base.width, 3);
  const vp = page.getViewport({ scale, rotation: rot });
  const canvas = document.createElement('canvas');
  canvas.width = Math.ceil(vp.width);
  canvas.height = Math.ceil(vp.height);
  const ctx = canvas.getContext('2d');
  ctx.fillStyle = '#fff';                       // JPEG n'a pas d'alpha
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  await page.render({ canvasContext: ctx, viewport: vp }).promise;
  return canvasToJpeg(canvas);
}

async function renderImageFile(file, extraRotation = 0) {
  const bmp = await createImageBitmap(file);
  const turned = extraRotation % 180 !== 0;
  const scale = Math.min(TARGET_WIDTH / (turned ? bmp.height : bmp.width), 3);
  const w = Math.ceil((turned ? bmp.height : bmp.width) * scale);
  const h = Math.ceil((turned ? bmp.width : bmp.height) * scale);
  const canvas = document.createElement('canvas');
  canvas.width = w; canvas.height = h;
  const ctx = canvas.getContext('2d');
  ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, w, h);
  ctx.translate(w / 2, h / 2);
  ctx.rotate(extraRotation * Math.PI / 180);
  ctx.drawImage(bmp, -bmp.width * scale / 2, -bmp.height * scale / 2,
                bmp.width * scale, bmp.height * scale);
  return canvasToJpeg(canvas);
}

/* ============================================================
   Appel du service OCR
   ============================================================ */
async function ocrPage(filename, pageNo, imageBase64) {
  const url = hookUrl();
  if (!url) throw new Error("Aucune URL de service OCR configurée.");
  const t0 = performance.now();
  const res = await fetch(url, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ filename, page: pageNo, imageBase64 }),
  });
  if (!res.ok) throw new Error(`Le service OCR a répondu ${res.status} ${res.statusText}`);
  const data = await res.json();
  if (!data.ok) throw new Error(data.error || 'Erreur OCR inconnue.');
  // JVBER = « %PDF » en base64. Sans ce contrôle, une charge utile invalide ne
  // se manifeste qu'à la fusion, sous forme d'une erreur pdf-lib incompréhensible
  // (« No PDF header found ») qui désigne le mauvais coupable.
  if (!/^JVBER/.test(data.pdfBase64 || '')) {
    throw new Error(
      "Le service OCR n'a pas renvoyé de PDF — reçu « " +
      String(data.pdfBase64 ?? 'rien').slice(0, 20) +
      " ». Le workflow n8n publié est probablement une version obsolète " +
      '(voir « Réimporter après modification » dans le README).');
  }
  data.roundTripMs = Math.round(performance.now() - t0);
  data.sentBytes = b64Bytes(imageBase64);
  return data;
}

/* ============================================================
   Traitement d'un document
   ============================================================ */
async function handleFiles(fileList) {
  const files = [...fileList];
  if (!files.length) return;
  if (!hookUrl()) {
    $('#landing-msg').innerHTML =
      '<span style="color:var(--err)">Configurez d\'abord l\'URL du service OCR ci-dessous.</span>';
    $('#settings').open = true;
    $('#hook').focus();
    return;
  }
  await workerReady;
  for (const f of files) await processFile(f);
}

async function processFile(file) {
  const doc = {
    id: crypto.randomUUID(), name: file.name, size: file.size,
    file, pages: [], native: false, tab: 'text', pdfUrl: null,
    status: 'working', error: null, startedAt: performance.now(),
  };
  docs.push(doc);
  if (!activeId) activeId = doc.id;
  busy = true; render();

  try {
    const isPdf = /\.pdf$/i.test(file.name) || file.type === 'application/pdf';
    if (isPdf) await processPdf(doc, file);
    else await processImage(doc, file);
    doc.status = 'done';
  } catch (e) {
    doc.status = 'error';
    doc.error = e.message;
  }
  doc.elapsed = Math.round(performance.now() - doc.startedAt);
  busy = docs.some(d => d.status === 'working');
  await rebuildPdf(doc);
  render();
}

async function processPdf(doc, file) {
  const buf = await file.arrayBuffer();
  const pdf = await pdfjsLib.getDocument({ data: buf.slice(0) }).promise;
  doc.pdf = pdf;
  doc.pageCount = pdf.numPages;

  // Le PDF possède-t-il déjà une couche texte ?
  const native = await detectNativeText(pdf);
  doc.nativeChars = native.chars;

  if (native.isNative && !$('#opt-force').checked) {
    // Déjà consultable : on n'appelle pas l'OCR, on lit la couche texte.
    doc.native = true;
    doc.pages = native.texts.map((t, i) => ({
      n: i + 1, text: t, rotation: 0, source: 'native', status: 'done',
    }));
    doc.originalBlob = new Blob([buf], { type: 'application/pdf' });
    render();
    return;
  }

  for (let n = 1; n <= pdf.numPages; n++) {
    doc.pages.push({ n, rotation: 0, status: 'working', text: '', source: 'ocr' });
    render();
    await runPage(doc, doc.pages[n - 1]);
  }
}

async function processImage(doc, file) {
  doc.pageCount = 1;
  doc.pages.push({ n: 1, rotation: 0, status: 'working', text: '', source: 'ocr' });
  render();
  await runPage(doc, doc.pages[0]);
}

/** OCR (ou ré-OCR) d'une page, en tenant compte de sa rotation courante. */
async function runPage(doc, page) {
  page.status = 'working';
  page.error = null;
  render();
  try {
    const img = doc.pdf
      ? await renderPdfPage(doc.pdf, page.n, page.rotation)
      : await renderImageFile(doc.file, page.rotation);
    const r = await ocrPage(doc.name, page.n, img);
    Object.assign(page, {
      text: (r.text || '').trim(), pdfBase64: r.pdfBase64,
      ms: r.ms, roundTripMs: r.roundTripMs, sentBytes: r.sentBytes,
      exitCode: r.exitCode, overlay: r.overlay, status: 'done',
    });
  } catch (e) {
    page.status = 'error';
    page.error = e.message;
  }
  render();
}

async function detectNativeText(pdf) {
  const texts = [];
  let chars = 0;
  for (let n = 1; n <= pdf.numPages; n++) {
    const tc = await (await pdf.getPage(n)).getTextContent();
    const t = tc.items.map(i => i.str).join(' ').replace(/\s+/g, ' ').trim();
    texts.push(t);
    chars += t.length;
  }
  return { isNative: chars >= NATIVE_MIN_CHARS, chars, texts };
}

/** Fusionne les PDF consultables page par page en un seul fichier. */
async function rebuildPdf(doc) {
  if (doc.pdfUrl) { URL.revokeObjectURL(doc.pdfUrl); doc.pdfUrl = null; }
  try {
    if (doc.native && doc.originalBlob) {          // déjà consultable tel quel
      doc.pdfUrl = URL.createObjectURL(doc.originalBlob);
      return;
    }
    const parts = doc.pages.filter(p => p.pdfBase64).map(p => p.pdfBase64);
    if (!parts.length) return;
    if (parts.length === 1) {
      doc.pdfUrl = URL.createObjectURL(b64ToBlob(parts[0]));
      return;
    }
    const out = await PDFLib.PDFDocument.create();
    for (const b64 of parts) {
      const src = await PDFLib.PDFDocument.load(b64);
      (await out.copyPages(src, src.getPageIndices())).forEach(p => out.addPage(p));
    }
    doc.pdfUrl = URL.createObjectURL(
      new Blob([await out.save()], { type: 'application/pdf' }));
  } catch (e) {
    doc.mergeError = e.message;
  }
}

function b64ToBlob(b64, type = 'application/pdf') {
  const bin = atob(b64);
  const arr = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
  return new Blob([arr], { type });
}

function fullText(doc) {
  return doc.pages
    .map(p => `----- Page ${p.n} -----\n\n${p.text || '(aucun texte)'}`)
    .join('\n\n');
}

/* ============================================================
   Rendu de l'interface
   ============================================================ */
const esc = s => String(s ?? '').replace(/[&<>"]/g,
  c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const kb = b => b >= 1048576 ? (b / 1048576).toFixed(1) + ' Mo' : Math.round(b / 1024) + ' Ko';
const secs = ms => (ms / 1000).toFixed(1).replace('.', ',') + ' s';

function render() {
  renderList();
  renderDetail();
}

function renderList() {
  if (!docs.length) {
    $('#doclist').innerHTML = `<p style="padding:0 8px;font-size:12.5px;color:var(--muted)">Aucun document pour l'instant.</p>`;
    return;
  }
  $('#doclist').innerHTML = docs.map(d => `
    <button class="doc-item ${d.id === activeId ? 'active' : ''}" data-doc="${d.id}">
      <span class="nm">${esc(d.name)}</span>
      <span class="mt">${d.status === 'working'
        ? 'traitement…'
        : d.status === 'error' ? 'échec'
        : `${d.pages.length} page${d.pages.length > 1 ? 's' : ''}${d.native ? ' · natif' : ''}`}</span>
    </button>`).join('');
}

function renderDetail() {
  const d = docs.find(x => x.id === activeId);
  if (!d) {
    $('#detail').innerHTML = `
      <div class="empty-state">
        <div>
          <div class="ico">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                 stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
              <path d="M14 2v6h6"/>
            </svg>
          </div>
          <strong>Aucun document sélectionné</strong>
          <p>Déposez un PDF ou une image à gauche pour lancer la reconnaissance de texte.</p>
        </div>
      </div>`;
    return;
  }

  const done = d.pages.filter(p => p.status === 'done').length;
  const failed = d.pages.filter(p => p.status === 'error').length;
  const total = d.pageCount || d.pages.length || 1;

  const tags = [
    `<span class="tag">${kb(d.size)}</span>`,
    `<span class="tag">${total} page${total > 1 ? 's' : ''}</span>`,
    d.native
      ? `<span class="tag ok">Texte natif — déjà consultable</span>`
      : `<span class="tag">OCR</span>`,
    d.elapsed ? `<span class="tag">${secs(d.elapsed)}</span>` : '',
    failed ? `<span class="tag err">${failed} page(s) en échec</span>` : '',
  ].join('');

  const working = d.status === 'working';

  $('#detail').innerHTML = `
    <div class="doc-head"><h2>${esc(d.name)}</h2></div>
    <div class="meta">${tags}</div>

    ${d.error ? `<div class="banner err"><div><b>Le traitement a échoué</b>${esc(d.error)}</div></div>` : ''}

    ${d.native ? `<div class="banner info"><div><b>Aucun OCR nécessaire</b>
      Ce PDF contient déjà une couche texte (${d.nativeChars} caractères) : son contenu est
      sélectionnable tel quel. Cochez « Forcer l'OCR » pour le passer quand même par l'OCR.
      </div></div>` : ''}

    ${working ? `
      <div class="prog">
        <div class="lbl">
          <b><span class="spin"></span> Analyse en cours…</b>
          <span>page ${Math.min(done + 1, total)} sur ${total}</span>
        </div>
        <div class="bar"><i style="width:${Math.round(done / total * 100)}%"></i></div>
      </div>` : `
      <div class="actions">
        <button class="btn primary" data-act="dl-pdf" ${d.pdfUrl ? '' : 'disabled'}>
          ⬇ PDF consultable</button>
        <button class="btn" data-act="dl-txt">⬇ Texte brut (.txt)</button>
        <button class="btn" data-act="dl-docx">⬇ Word (.docx)</button>
        <button class="btn" data-act="dl-xlsx">⬇ Excel (.xlsx)</button>
        <button class="btn ghost" data-act="copy">Copier le texte</button>
      </div>`}

    ${d.pages.length ? renderPanes(d) : ''}
  `;
}

function renderPanes(d) {
  return `
  <div class="panes">
    <div class="pane">
      <div class="pane-h"><h3>Document</h3><div class="spacer"></div>
        <span class="tag">texte sélectionnable</span></div>
      ${d.pdfUrl
        ? `<iframe src="${d.pdfUrl}" title="PDF consultable"></iframe>`
        : `<div style="padding:40px;text-align:center;color:var(--muted);font-size:13.5px">
             ${d.mergeError ? 'Fusion impossible : ' + esc(d.mergeError) : 'PDF en préparation…'}</div>`}
    </div>

    <div class="pane">
      <div class="pane-h">
        <div class="tabs">
          <button class="tab ${d.tab === 'text' ? 'on' : ''}" data-tab="text">Texte brut</button>
          <button class="tab ${d.tab === 'info' ? 'on' : ''}" data-tab="info">Détails</button>
        </div>
      </div>
      <div class="tab-body">${d.tab === 'text' ? renderText(d) : renderInfo(d)}</div>
    </div>
  </div>`;
}

function renderText(d) {
  return d.pages.map(p => `
    <div class="page-block">
      <div class="page-bar">
        <span class="n">PAGE ${p.n}</span>
        ${p.status === 'working' ? '<span class="spin"></span>' : ''}
        ${p.status === 'error' ? `<span class="tag err">${esc(p.error)}</span>` : ''}
        ${p.rotation ? `<span class="tag">pivotée ${p.rotation}°</span>` : ''}
        <div class="spacer"></div>
        ${p.source === 'ocr' && p.status !== 'working' ? `
          <button class="btn sm ghost" data-rotate="${p.n}" title="Pivoter de 90° et relancer l'OCR">
            ⟳ Pivoter</button>` : ''}
      </div>
      ${p.status === 'working'
        ? '<pre class="empty">Analyse…</pre>'
        : `<pre${p.text ? '' : ' class="empty"'}>${esc(p.text || 'Aucun texte détecté sur cette page.')}</pre>`}
    </div>`).join('');
}

function renderInfo(d) {
  const rows = [
    ['Fichier', d.name],
    ['Taille', kb(d.size)],
    ['Pages', d.pageCount],
    ['Méthode', d.native ? 'Couche texte native (aucun appel OCR)' : 'OCR'],
    ['Durée totale', d.elapsed ? secs(d.elapsed) : '—'],
  ];
  if (!d.native) {
    d.pages.forEach(p => rows.push([
      `Page ${p.n}`,
      p.status === 'error' ? `échec — ${p.error}`
        : `${p.sentBytes ? kb(p.sentBytes) + ' envoyés · ' : ''}${p.ms ?? '?'} ms OCR · ` +
          `${p.roundTripMs ?? '?'} ms aller-retour${p.rotation ? ` · pivotée ${p.rotation}°` : ''}`,
    ]));
  }
  return `<table class="kv">${rows.map(([k, v]) =>
    `<tr><td>${esc(k)}</td><td>${esc(v)}</td></tr>`).join('')}</table>`;
}

/* ============================================================
   Événements
   ============================================================ */
const drop = $('#drop');
drop.onclick = () => $('#file').click();
drop.onkeydown = e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); $('#file').click(); } };
$('#file').onchange = e => handleFiles(e.target.files);

['dragenter', 'dragover'].forEach(ev =>
  drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.add('over'); }));
['dragleave', 'drop'].forEach(ev =>
  drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.remove('over'); }));
drop.addEventListener('drop', e => handleFiles(e.dataTransfer.files));
// évite qu'un fichier lâché à côté de la zone ouvre le navigateur
['dragover', 'drop'].forEach(ev =>
  window.addEventListener(ev, e => { if (!drop.contains(e.target)) e.preventDefault(); }));

$('#hook').value = localStorage.getItem('ocrHook') || WEBHOOK_URL;
$('#hook-save').onclick = () => {
  localStorage.setItem('ocrHook', $('#hook').value.trim());
  $('#landing-msg').innerHTML = '<span style="color:var(--ok)">Service OCR enregistré.</span>';
};
if (!hookUrl()) $('#settings').open = true;
render();

document.addEventListener('click', async e => {
  const d = docs.find(x => x.id === activeId);

  const pick = e.target.closest('[data-doc]');
  if (pick) { activeId = pick.dataset.doc; return render(); }

  const tab = e.target.closest('[data-tab]');
  if (tab && d) { d.tab = tab.dataset.tab; return render(); }

  const rot = e.target.closest('[data-rotate]');
  if (rot && d && !busy) {
    const page = d.pages.find(p => p.n === +rot.dataset.rotate);
    page.rotation = (page.rotation + 90) % 360;
    busy = true; render();
    await runPage(d, page);
    busy = false;
    await rebuildPdf(d);
    return render();
  }

  const act = e.target.closest('[data-act]')?.dataset.act;
  if (!act || !d) return;
  if (act === 'dl-pdf' && d.pdfUrl) {
    download(d.pdfUrl, d.name.replace(/\.[^.]+$/, '') + '-consultable.pdf');
  } else if (act === 'dl-txt') {
    downloadBlob(d, '.txt', new Blob([fullText(d)], { type: 'text/plain;charset=utf-8' }));
  } else if (act === 'dl-docx' || act === 'dl-xlsx') {
    // La conversion prend plusieurs secondes : on verrouille le bouton le temps
    // de l'aller-retour plutôt que de laisser l'utilisateur cliquer en rafale.
    const btn = e.target.closest('[data-act]');
    const label = btn.textContent;
    btn.disabled = true; btn.textContent = '⏳ Conversion…';
    try {
      // Word part chez Adobe (mise en page conservée) ; le tableur est reconstruit
      // ici depuis la géométrie du texte : pas de quota, pas d'aller-retour.
      if (act === 'dl-xlsx') await exportXlsx(d);
      else await exportDocx(d);
      $('#landing-msg').innerHTML = '<span style="color:var(--ok)">Fichier converti.</span>';
    } catch (err) {
      $('#landing-msg').innerHTML =
        `<span style="color:var(--err)">${err.message}</span>`;
    } finally {
      btn.disabled = false; btn.textContent = label;
    }
  } else if (act === 'copy') {
    await navigator.clipboard.writeText(fullText(d));
    e.target.textContent = '✓ Copié';
    setTimeout(() => { e.target.textContent = 'Copier le texte'; }, 1600);
  }
});

function download(url, name) {
  const a = document.createElement('a');
  a.href = url; a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
}

function downloadBlob(doc, ext, blob) {
  const url = URL.createObjectURL(blob);
  download(url, doc.name.replace(/\.[^.]+$/, '') + ext);
  setTimeout(() => URL.revokeObjectURL(url), 2000);
}

const EXPORT_MIME = {
  docx: 'application/vnd.openxmlformats-officedocument.wordprocessingml.document',
  xlsx: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet',
};

const blobToB64 = blob => new Promise((res, rej) => {
  const r = new FileReader();
  r.onload = () => res(String(r.result).split(',')[1]);
  r.onerror = () => rej(new Error('Lecture du fichier impossible.'));
  r.readAsDataURL(blob);
});

/** PDF à convertir : l'original s'il y en a un, sinon celui reconstruit par l'OCR. */
async function sourcePdf(doc) {
  const isPdf = /\.pdf$/i.test(doc.name) || doc.file?.type === 'application/pdf';
  if (isPdf && doc.file) return doc.file;
  if (!doc.pdfUrl) throw new Error('Aucun PDF disponible pour ce document.');
  return (await fetch(doc.pdfUrl)).blob();
}

/**
 * Conversion Word déléguée à Adobe PDF Services via n8n : c'est le seul chemin
 * qui restitue la mise en page d'origine. Le tableur, lui, est fabriqué
 * localement (voir plus bas) — Adobe n'y intervient plus.
 */
async function exportDocx(doc) {
  const blob = await sourcePdf(doc);
  if (blob.size > MAX_EXPORT_BYTES) {
    throw new Error(`PDF trop volumineux (${kb(blob.size)}, maximum ${kb(MAX_EXPORT_BYTES)}).`);
  }
  const res = await fetch(exportUrl(), {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({
      pdfBase64: await blobToB64(blob),
      ocr: !doc.native,          // couche texte déjà présente => inutile de re-OCR
    }),
  });
  if (!res.ok) throw new Error(`Le service de conversion a répondu ${res.status} ${res.statusText}`);
  const data = await res.json();
  if (!data.ok) throw new Error(data.error || 'Conversion échouée.');
  // PK = signature ZIP : docx et xlsx en sont. Sans ce contrôle, une réponse
  // d'erreur se télécharge en silence sous forme de fichier illisible.
  if (!/^UEsDB/.test(data.fileBase64 || '')) {
    throw new Error('La réponse du service n’est pas un fichier Office valide.');
  }
  downloadBlob(doc, '.docx', b64ToBlob(data.fileBase64, EXPORT_MIME.docx));
}

/* ============================================================
   Tableur — reconstruction des colonnes par géométrie
   ------------------------------------------------------------
   L'ancienne chaîne passait par un .docx dont on relisait les
   <w:tbl>. Un tableau sans filets (HENKEL) n'en produit aucun :
   l'export était alors inexploitable, et rien dans le .docx ne
   permettait de le rattraper.
   On travaille donc sur la position des mots — que le PDF soit
   natif (pdf.js) ou scanné (calque OCR.space) — et on cherche les
   *blancs* entre les colonnes plutôt que les bords du texte : une
   colonne de montants alignée à droite n'a pas de bord gauche
   commun, mais le blanc qui la précède, lui, existe toujours.
   ============================================================ */

// ponytail: seuils calibrés sur les échantillons de xp/. Un document très dense
// ou très aéré demande de les ajuster — ce sont les seules constantes à toucher.
const ROW_TOL   = 0.6;   // écart vertical max (en hauteur de police) sur une même ligne
const GAP_EM    = 0.8;   // blanc minimal (en hauteur de police) séparant deux colonnes
const VOTE_FRAC = 0.2;   // part des lignes devant confirmer une frontière de colonne
const MIN_COLS  = 3;     // en deçà, ce n'est pas un tableau
const MIN_ROWS  = 3;

const median = a => a.length ? [...a].sort((x, y) => x - y)[a.length >> 1] : 0;

/** Mots triés en lignes visuelles. `em` = hauteur de police médiane, l'unité de tout le reste. */
function groupLines(words) {
  const em = median(words.map(w => w.h)) || 10;
  const lines = [];
  for (const w of [...words].sort((a, b) => a.y - b.y || a.x - b.x)) {
    const cur = lines[lines.length - 1];
    if (cur && w.y - cur.y <= em * ROW_TOL) cur.words.push(w);
    else lines.push({ y: w.y, words: [w] });
  }
  for (const l of lines) l.words.sort((a, b) => a.x - b.x);
  return { lines, em };
}

/** Nombre de blocs séparés par un blanc >= gap. Les boîtes peuvent se chevaucher. */
function groupCount(line, gap) {
  let n = 1, right = line.words[0].x + line.words[0].w;
  for (const w of line.words.slice(1)) {
    if (w.x - right >= gap) n++;
    right = Math.max(right, w.x + w.w);
  }
  return n;
}

/** Suites de lignes à structure multi-colonnes — les tableaux candidats de la page. */
function tabularBands(lines, gap) {
  const bands = [];
  let cur = null, skipped = 0;
  for (const l of lines) {
    if (groupCount(l, gap) >= MIN_COLS) {
      if (!cur) bands.push(cur = []);
      cur.push(l); skipped = 0;
    } else if (cur && skipped++ < 1) {
      cur.push(l);                       // une ligne isolée ne coupe pas le tableau
    } else cur = null;
  }
  // la ligne tolérée ci-dessus peut rester en queue de bande : on la retire
  for (const b of bands) {
    while (b.length && groupCount(b[b.length - 1], gap) < MIN_COLS) b.pop();
  }
  return bands.filter(b => b.length >= MIN_ROWS);
}

/**
 * Frontières de colonnes, par vote : chaque blanc intra-ligne >= gap propose une
 * frontière, les propositions voisines se regroupent, et seules celles soutenues
 * par plusieurs lignes sont retenues.
 *
 * La première version exigeait au contraire un couloir vertical *entièrement*
 * blanc sur toute la bande. C'était plus précis sur un long tableau, mais un seul
 * libellé débordant suffisait à effacer la frontière — et sur une facture à une
 * seule ligne d'article (7885, 6701) il ne restait presque aucune colonne. Le vote
 * tolère les débordements : le mot à cheval est ensuite rangé par son centre.
 */
function columnEdges(band, gap) {
  const cand = [];
  for (const l of band) {
    let right = l.words[0].x + l.words[0].w;
    for (const w of l.words.slice(1)) {
      if (w.x - right >= gap) cand.push({ mid: (right + w.x) / 2, line: l });
      right = Math.max(right, w.x + w.w);
    }
  }
  cand.sort((a, b) => a.mid - b.mid);

  const groups = [];
  for (const c of cand) {
    const g = groups[groups.length - 1];
    // deux propositions distantes de moins d'un blanc décrivent la même frontière
    if (g && c.mid - g.mid <= gap) { g.sum += c.mid; g.mid = g.sum / ++g.n; g.lines.add(c.line); }
    else groups.push({ mid: c.mid, sum: c.mid, n: 1, lines: new Set([c.line]) });
  }
  const need = Math.max(2, Math.ceil(band.length * VOTE_FRAC));
  return groups.filter(g => g.lines.size >= need).map(g => g.mid);
}

/** Chaque mot tombe dans la colonne qui contient son *centre* — vrai quel que soit l'alignement. */
function toRows(band, edges) {
  const col = x => { let i = 0; while (i < edges.length && x >= edges[i]) i++; return i; };
  return band.map(l => {
    const cells = new Array(edges.length + 1).fill('');
    for (const w of l.words) {
      const c = col(w.x + w.w / 2);
      cells[c] = cells[c] ? cells[c] + ' ' + w.text : w.text;
    }
    return cells;
  });
}

/** Retire les colonnes et les lignes entièrement vides. */
function trimGrid(rows) {
  if (!rows.length) return rows;
  const width = Math.max(...rows.map(r => r.length));
  const keep = [];
  for (let c = 0; c < width; c++) if (rows.some(r => (r[c] ?? '').trim())) keep.push(c);
  return rows.map(r => keep.map(c => (r[c] ?? '').trim())).filter(r => r.some(Boolean));
}

/**
 * Tous les tableaux d'une page, du plus « lignes d'articles » au moins probable.
 * Le score privilégie ce qui est grand *et* chiffré : l'entête d'adresse perd
 * contre le tableau des articles, sans jamais être supprimé pour autant.
 */
function detectBands(words) {
  if (words.length < 6) return [];
  const { lines, em } = groupLines(words);
  const gap = em * GAP_EM;
  return tabularBands(lines, gap).map(band => {
    const rows = trimGrid(toRows(band, columnEdges(band, gap)));
    const cells = rows.flat();
    const numeric = cells.filter(c => /\d/.test(c)).length / Math.max(cells.length, 1);
    return { rows, score: rows.length * (rows[0]?.length ?? 0) * (0.2 + numeric) };
  }).filter(b => b.rows.length >= MIN_ROWS && b.rows[0].length >= MIN_COLS)
    .sort((a, b) => b.score - a.score);
}

/* ---------- typage des cellules ---------- */

const CURRENCY = /^[€$]\s*|\s*(?:DT|TND|EUR|USD|MAD|DH|€|\$)$/gi;
// FR « 1 234,56 » / EN « 1,234.56 ». `s` couvre déjà l'espace insécable (U+00A0)
// et l'insécable fin (U+202F), que les PDF emploient pour les milliers.
const NUM_FR = /^\d{1,3}(?:[\s.]\d{3})*(?:,\d+)?$|^\d+(?:,\d+)?$/;
const NUM_EN = /^\d{1,3}(?:[\s,]\d{3})*(?:\.\d+)?$|^\d+(?:\.\d+)?$/;

/** Virgule ou point décimal ? Tranché une fois par document, sur ce qui domine. */
const isFrench = text =>
  (text.match(/\d,\d{1,2}\b/g) ?? []).length >= (text.match(/\d\.\d{1,2}\b/g) ?? []).length;

/**
 * Renvoie {v} — et {z} quand Excel a besoin d'un format. Trois pièges volontairement
 * laissés en texte : un code à zéro initial (« 007 »), une suite de plus de 15 chiffres
 * (RIB, code-barres — un Number la tronquerait) et tout ce qui ne matche pas le motif.
 */
function typeCell(raw, fr) {
  const s = String(raw ?? '').trim();
  if (!s) return { v: '' };

  const d = s.match(/^(\d{1,2})[\/.-](\d{1,2})[\/.-](\d{2,4})$/);
  if (d) {
    const y = +d[3] < 100 ? 2000 + +d[3] : +d[3];
    const dt = new Date(Date.UTC(y, +d[2] - 1, +d[1]));
    if (dt.getUTCMonth() === +d[2] - 1 && dt.getUTCDate() === +d[1]) return { v: dt, z: 'dd/mm/yyyy' };
  }

  let t = s, neg = false, pct = false;
  if (/^\(.*\)$/.test(t)) { t = t.slice(1, -1).trim(); neg = true; }   // (1 234,56) = négatif
  if (t.endsWith('%')) { t = t.slice(0, -1).trim(); pct = true; }
  t = t.replace(CURRENCY, '').trim();
  // « 204,444- » : le signe en fin de nombre est la convention SAP, et c'est
  // ainsi que HENKEL écrit toutes ses remises.
  if (t.startsWith('-') || t.endsWith('-')) { neg = !neg; t = t.replace(/^-|-$/, '').trim(); }

  if (!(fr ? NUM_FR : NUM_EN).test(t)) return { v: s };
  if (/^0\d/.test(t)) return { v: s };
  // au-delà de 12 chiffres ce n'est plus un montant mais un code (EAN, RIB) :
  // le garder en texte évite l'affichage scientifique et la perte de précision
  if (t.replace(/\D/g, '').length > 12) return { v: s };

  const dec = fr ? ',' : '.';
  const n = Number(t.replace(fr ? /[\s.]/g : /[\s,]/g, '').replace(dec, '.'));
  if (!isFinite(n)) return { v: s };
  const places = t.includes(dec) ? Math.min(t.split(dec)[1].length, 4) : 0;
  return {
    v: (neg ? -n : n) / (pct ? 100 : 1),
    z: pct ? '0.0%' : '#,##0' + (places ? '.' + '0'.repeat(places) : ''),
  };
}

/* ---------- mots positionnés ---------- */

const deaccent = s => s.normalize('NFD').replace(/[\u0300-\u036f]/g, '');

/** Couche texte d'un PDF natif : pdf.js donne déjà x/y, origine en bas à gauche. */
async function nativeWords(pdf, n) {
  const page = await pdf.getPage(n);
  const vp = page.getViewport({ scale: 1 });
  const tc = await page.getTextContent({ disableCombineTextItems: true });
  const out = [];
  for (const it of tc.items) {
    if (!it.str.trim()) continue;
    const h = Math.abs(it.transform[3]) || it.height || 10;
    const per = it.width / Math.max(it.str.length, 1);
    // pdf.js rend parfois toute une ligne en un seul item : on la recoupe sur les
    // blancs multiples, sinon la ligne couvre chaque couloir et aucune colonne
    // n'est détectable. Les séparateurs sont conservés pour garder les décalages.
    let off = 0;
    for (const part of it.str.split(/(\s{2,})/)) {
      if (part.trim()) out.push({
        x: it.transform[4] + off * per, y: vp.height - it.transform[5],
        w: part.length * per, h, text: part.trim(),
      });
      off += part.length;
    }
  }
  return out;
}

/** Calque OCR.space : origine en haut à gauche, dans les pixels de l'image envoyée. */
const overlayWords = ov => (ov?.Lines ?? []).flatMap(l => (l.Words ?? [])
  .filter(w => String(w.WordText).trim())
  .map(w => ({ x: w.Left, y: w.Top, w: w.Width, h: w.Height, text: String(w.WordText).trim() })));

/**
 * La couche native est plus précise que l'OCR quand elle existe — sauf si
 * l'utilisateur a pivoté la page, auquel cas seule la géométrie du calque
 * correspond à ce qui a été reconnu.
 */
async function pageWords(doc, page) {
  if (doc.pdf && doc.nativeChars >= NATIVE_MIN_CHARS && !page.rotation) {
    return { source: 'natif', words: await nativeWords(doc.pdf, page.n) };
  }
  return { source: 'calque', words: overlayWords(page.overlay) };
}

/* ---------- écriture du classeur ---------- */

const HEAD = { qty: /^(qte|quantite|qty|nb|nbre|nombre)/, pu: /^(pu|prixunit|prixu|puht|prix)/,
               tot: /^(montant|total|mtht|mht|mt|valeur)/, rem: /^(remise|rem|escompte|disc)/ };

/** Index de la colonne dont l'entête matche `re`, ou -1. */
const headCol = (row, re) =>
  row.findIndex(c => re.test(deaccent(String(c)).toLowerCase().replace(/[^a-z]/g, '')));

/**
 * Première ligne portant un libellé de colonne connu *et* suivie de chiffres.
 * Deux garde-fous, chacun rattrapant l'échec de l'autre :
 *  - sans le mot-clé, une ligne de méta (« Référence commande … » sur 7885)
 *    passait pour l'entête, le gras tombait à côté et les contrôles ne
 *    trouvaient rien ;
 *  - sans « suivie de chiffres », exiger deux mots-clés faisait préférer le bloc
 *    de totaux à la vraie entête d'articles (6701), qui n'en porte qu'un seul.
 */
function headerRow(rows) {
  const res = Object.values(HEAD);
  const numeric = r => (r ?? []).filter(c => /\d/.test(c)).length;
  for (let i = 0; i < Math.min(rows.length - 1, 6); i++) {
    if (res.some(re => headCol(rows[i], re) >= 0) && numeric(rows[i + 1]) >= 2) return i;
  }
  return 0;
}

function sheetFromBand(wb, name, band, fr) {
  const ws = wb.addWorksheet(name);
  band = { rows: band.rows.slice(headerRow(band.rows)) };   // on jette les méta au-dessus de l'entête
  const typed = band.rows.map(r => r.map(c => typeCell(c, fr)));

  typed.forEach(r => ws.addRow(r.map(c => c.v)));
  typed.forEach((r, ri) => r.forEach((c, ci) => {
    if (c.z) ws.getRow(ri + 1).getCell(ci + 1).numFmt = c.z;
  }));

  // entête : gras, figée, largeurs ajustées au contenu
  const head = ws.getRow(1);
  head.font = { bold: true };
  head.fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: 'FFEEF2FF' } };
  ws.views = [{ state: 'frozen', ySplit: 1 }];
  ws.columns.forEach((col, ci) => {
    col.width = Math.min(50, Math.max(9, ...band.rows.map(r => (r[ci] ?? '').length + 2)));
  });
  return { ws, typed, rows: band.rows };
}

/**
 * Colonne « Contrôle » : qté × PU comparé au montant lu, et somme des montants.
 * C'est le seul endroit où le classeur dit *où* l'OCR s'est trompé plutôt que de
 * demander qu'on le croie sur parole.
 */
function addChecks(ws, typed, rows) {
  const [q, p, t] = [HEAD.qty, HEAD.pu, HEAD.tot].map(re => headCol(rows[0], re));
  const last = typed.length;
  if (last < 2) return;

  if (t >= 0) {                              // total de contrôle sous la colonne des montants
    const cell = ws.getRow(last + 2).getCell(t + 1);
    cell.value = { formula: `SUM(${ws.getColumn(t + 1).letter}2:${ws.getColumn(t + 1).letter}${last})` };
    cell.numFmt = '#,##0.00';
    cell.font = { bold: true };
    // le libellé va à gauche de la somme — sauf si les montants sont déjà en
    // première colonne, auquel cas il l'écraserait
    if (t >= 1) ws.getRow(last + 2).getCell(t).value = 'Somme calculée';
  }
  if (q < 0 || p < 0 || t < 0) return;

  const [Q, P, T] = [q, p, t].map(i => ws.getColumn(i + 1).letter);
  // La remise fait partie du calcul : sans elle, chaque ligne remisée serait
  // signalée comme une erreur de lecture, et l'alerte ne vaudrait plus rien.
  const rc = headCol(rows[0], HEAD.rem);
  const R = rc >= 0 ? ws.getColumn(rc + 1).letter : null;
  const ci = rows[0].length + 1;
  ws.getRow(1).getCell(ci).value = R ? 'Écart qté×PU−remise' : 'Écart qté×PU';
  ws.getRow(1).getCell(ci).font = { bold: true };
  for (let r = 2; r <= last; r++) {
    const net = R ? `${Q}${r}*${P}${r}*(1-N(${R}${r}))` : `${Q}${r}*${P}${r}`;
    const cell = ws.getRow(r).getCell(ci);
    cell.value = { formula: `IF(COUNT(${Q}${r},${P}${r},${T}${r})<3,"",ROUND(${net},2)-ROUND(${T}${r},2))` };
    cell.numFmt = '#,##0.00';
  }
  ws.getColumn(ci).width = 14;
  // un écart non nul = une valeur mal lue : c'est ce qu'on veut voir en rouge
  ws.addConditionalFormatting({
    ref: `${ws.getColumn(ci).letter}2:${ws.getColumn(ci).letter}${last}`,
    rules: [{
      type: 'expression', priority: 1,
      formulae: [`AND(ISNUMBER(${ws.getColumn(ci).letter}2),ABS(${ws.getColumn(ci).letter}2)>0.01)`],
      style: { fill: { type: 'pattern', pattern: 'solid', bgColor: { argb: 'FFFDECED' } },
               font: { color: { argb: 'FFC62828' }, bold: true } },
    }],
  });
}

async function exportXlsx(doc) {
  const bands = [];
  let mots = 0, calqueVide = 0;
  for (const p of doc.pages) {
    const { source, words } = await pageWords(doc, p);
    mots += words.length;
    if (source === 'calque' && !words.length) calqueVide++;
    for (const b of detectBands(words)) bands.push({ ...b, page: p.n });
  }
  if (!bands.length) {
    // Zéro mot positionné n'accuse pas le document : c'est que le workflow publié
    // ne renvoie pas encore le calque. Sans cette distinction, une version n8n
    // obsolète se présente comme « ce document n'a pas de tableau » — exactement
    // le genre d'erreur muette qui coûte une heure.
    if (!mots && calqueVide) throw new Error(
      `Aucune position de texte reçue pour ce document (${calqueVide} page(s) sans calque OCR). ` +
      'Le workflow n8n publié est probablement antérieur à isOverlayRequired : réimportez ' +
      'et publiez ocr-workflow.json (voir « Réimporter après modification » dans le README).');
    throw new Error("Aucun tableau détecté dans ce document — l'export Word conserve la mise en page.");
  }
  bands.sort((a, b) => b.score - a.score);

  const fr = isFrench(fullText(doc));
  const wb = new ExcelJS.Workbook();
  bands.forEach((band, i) => {
    const name = i ? `Tableau ${i + 1} (p.${band.page})` : 'Lignes';
    const { ws, typed, rows } = sheetFromBand(wb, name, band, fr);
    if (!i) addChecks(ws, typed, rows);
  });

  // trace : de quoi vérifier une cellule douteuse sans rouvrir le PDF
  const audit = wb.addWorksheet('Texte');
  audit.getColumn(1).width = 120;
  audit.addRow([doc.name]);
  audit.getRow(1).font = { bold: true };
  for (const p of doc.pages) {
    audit.addRow([`----- Page ${p.n} -----`]);
    for (const line of (p.text || '').split('\n')) audit.addRow([line.slice(0, 32000)]);
  }

  downloadBlob(doc, '.xlsx',
    new Blob([await wb.xlsx.writeBuffer()], { type: EXPORT_MIME.xlsx }));
}

/* ============================================================
   Auto-test — ouvrir index.html?selftest=1
   Vérifie les morceaux non triviaux : plafonnement de taille
   JPEG, fusion multi-pages, détection des colonnes et typage.
   ============================================================ */
if (new URLSearchParams(location.search).has('selftest')) (async () => {
  const ok = (c, m) => console[c ? 'log' : 'error'](c ? '✓' : '✗ ÉCHEC', m);

  // 1. b64Bytes correspond à la taille réelle décodée
  const probe = document.createElement('canvas');
  probe.width = probe.height = 64;
  const pctx = probe.getContext('2d');
  pctx.fillStyle = '#c33'; pctx.fillRect(0, 0, 64, 64);
  const url = probe.toDataURL('image/jpeg', 0.8);
  ok(b64Bytes(url) === b64ToBlob(url.split(',')[1], 'image/jpeg').size,
     'b64Bytes = taille décodée réelle');

  // 2. canvasToJpeg reste sous MAX_BYTES même sur du bruit incompressible
  const big = document.createElement('canvas');
  big.width = big.height = 2600;
  const bctx = big.getContext('2d');
  const img = bctx.createImageData(2600, 2600);
  for (let i = 0; i < img.data.length; i++) img.data[i] = (Math.random() * 255) | 0;
  bctx.putImageData(img, 0, 0);
  const jpeg = canvasToJpeg(big);
  ok(b64Bytes(jpeg) <= MAX_BYTES,
     `canvasToJpeg plafonne le bruit à ${kb(b64Bytes(jpeg))} (max ${kb(MAX_BYTES)})`);

  // 3. la fusion produit bien la somme des pages
  const mk = async n => {
    const p = await PDFLib.PDFDocument.create();
    for (let i = 0; i < n; i++) p.addPage([200, 200]);
    return p.saveAsBase64();
  };
  const doc = { pages: [{ pdfBase64: await mk(3) }, { pdfBase64: await mk(2) }] };
  await rebuildPdf(doc);
  const merged = await PDFLib.PDFDocument.load(await (await fetch(doc.pdfUrl)).arrayBuffer());
  ok(merged.getPageCount() === 5, `fusion 3+2 pages = ${merged.getPageCount()} (attendu 5)`);

  // 4. l'URL d'export se déduit de celle de l'OCR, barre finale comprise
  const cases = [
    ['http://localhost:5678/webhook/ocr',   'http://localhost:5678/webhook/export'],
    ['https://n8n.example.com/webhook/ocr/', 'https://n8n.example.com/webhook/export'],
  ];
  cases.forEach(([from, want]) =>
    ok(toExportUrl(from) === want, `toExportUrl(${from}) → ${toExportUrl(from)}`));

  // 5. détection de colonnes sur un tableau SANS filets, montants alignés à droite
  //    (le cas HENKEL, que l'ancienne lecture des <w:tbl> ne voyait pas du tout),
  //    précédé d'un bloc adresse qui ne doit pas être happé par le tableau.
  const W = (text, x, y, w) => ({ x, y, w, h: 10, text });
  const words = [
    W('SOCIETE', 40, 20, 60), W('EXEMPLE', 105, 20, 60),   // bloc adresse : 2 groupes
    W('12 RUE DU PORT', 40, 34, 90),
    W('Designation', 40, 70, 70), W('Qte', 300, 70, 22), W('PU', 380, 70, 16), W('Montant', 450, 70, 45),
    W('Vis inox M6', 40, 86, 66), W('12', 310, 86, 12), W('3,50', 372, 86, 24), W('42,00', 470, 86, 25),
    W('Ecrou laiton', 40, 100, 70), W('4', 318, 100, 6), W('12,25', 366, 100, 30), W('49,00', 470, 100, 25),
    W('Joint torique', 40, 114, 74), W('100', 304, 114, 18), W('0,80', 372, 114, 24), W('80,00', 470, 114, 25),
  ];
  const bands = detectBands(words);
  const grid = bands[0]?.rows ?? [];
  ok(grid.length === 4 && grid[0].length === 4,
     `tableau sans filets → ${grid.length} lignes × ${grid[0]?.length} colonnes (attendu 4 × 4)`);
  ok(grid[1]?.[0] === 'Vis inox M6' && grid[1]?.[3] === '42,00',
     `libellé et montant dans les bonnes colonnes (${grid[1]?.[0]} | ${grid[1]?.[3]})`);
  ok(!grid.flat().includes('SOCIETE'), "le bloc adresse reste hors du tableau d'articles");

  // 5 bis. même tableau, mais au format du calque OCR.space : c'est le chemin des
  //        scans, et la seule chose qui diffère est la forme de la charge utile.
  const mkLine = (y, cells) => ({ Words: cells.map(([t, x, w]) =>
    ({ WordText: t, Left: x, Top: y, Width: w, Height: 14 })) });
  const scan = detectBands(overlayWords({ Lines: [
    mkLine(30,  [['FOURNISSEUR', 60, 120], ['SARL', 190, 50]]),
    mkLine(90,  [['Designation', 60, 90], ['Qte', 420, 30], ['PU', 530, 22], ['Montant', 630, 60]]),
    mkLine(112, [['Vis inox M6', 60, 86], ['12', 434, 16], ['3,50', 520, 32], ['42,00', 658, 34]]),
    mkLine(134, [['Ecrou laiton', 60, 92], ['4', 442, 8], ['12,25', 508, 42], ['49,00', 658, 34]]),
    mkLine(156, [['Joint torique', 60, 96], ['100', 426, 24], ['0,80', 520, 32], ['80,00', 658, 34]]),
  ] }))[0]?.rows ?? [];
  ok(scan.length === 4 && scan[0].length === 4 && scan[3]?.[3] === '80,00',
     `calque OCR → ${scan.length} lignes × ${scan[0]?.length} colonnes (attendu 4 × 4)`);

  // 6. typage : les trois pièges qui corrompaient des données en silence
  const T = (s, fr = true) => typeCell(s, fr).v;
  [['1 234,56', 1234.56], ['007', '007'], ['12,5 %', 0.125], ['(1 234,56)', -1234.56],
   ['204,444-', -204.444], ['14,00- %', -0.14], ['3838824426716', '3838824426716'],
   ['FAC21-MBK01681', 'FAC21-MBK01681']]
    .forEach(([input, want]) =>
      ok(T(input) === want, `typeCell(${input}) → ${JSON.stringify(T(input))}`));
  ok(T('1,234.56', false) === 1234.56, `typeCell anglo-saxon → ${T('1,234.56', false)}`);
  ok(T('15/03/2026') instanceof Date, 'une date devient une vraie date Excel');
  ok(isFrench('total 1 234,56 HT') && !isFrench('total 1,234.56 net'),
     'la locale décimale est déduite du document');

  console.log('Auto-test terminé.');
})();
