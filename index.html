<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>NEXT OCR</title>
<link rel="icon" href="next_logo.png">
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://unpkg.com/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
<style>
:root{
  --bg:#f6f7f9; --surface:#fff; --surface-2:#fbfcfd; --border:#e3e6ea;
  --text:#15181d; --muted:#6b7280; --accent:#4f46e5; --accent-soft:#eef2ff;
  --ok:#0f8a5f; --ok-soft:#e7f6ef; --warn:#b45309; --warn-soft:#fef4e6;
  --err:#c62828; --err-soft:#fdeced;
  --radius:12px; --shadow:0 1px 2px rgba(16,24,40,.05),0 4px 16px rgba(16,24,40,.06);
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#0d1013; --surface:#15191e; --surface-2:#1a1f25; --border:#272e36;
    --text:#e8eaed; --muted:#98a2ae; --accent:#8b87f5; --accent-soft:#1e1f3d;
    --ok:#4ade80; --ok-soft:#10251c; --warn:#fbbf24; --warn-soft:#2a2010;
    --err:#f87171; --err-soft:#2c1416;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 16px rgba(0,0,0,.25);
  }
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0; background:var(--bg); color:var(--text);
  font:15px/1.55 ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  -webkit-font-smoothing:antialiased;
}
button{font:inherit;color:inherit;cursor:pointer}
h1,h2,h3{margin:0;font-weight:600;letter-spacing:-.01em}

/* ---------- shell ---------- */
.app{display:flex;flex-direction:column;height:100vh}
header{
  display:flex;align-items:center;gap:14px;padding:14px 22px;
  background:var(--surface);border-bottom:1px solid var(--border);flex:none;
}
.logo{
  width:44px;height:44px;border-radius:9px;flex:none;display:block;
  object-fit:contain;
}
.brand h1{font-size:15px}
.brand p{margin:0;font-size:12.5px;color:var(--muted)}
header .spacer{flex:1}

.btn{
  border:1px solid var(--border);background:var(--surface);padding:8px 14px;
  border-radius:9px;font-size:13.5px;font-weight:500;
  display:inline-flex;align-items:center;gap:7px;transition:.15s;
}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{filter:brightness(1.08);color:#fff}
.btn.ghost{border-color:transparent;background:transparent;color:var(--muted)}
.btn.ghost:hover{background:var(--surface-2);color:var(--text)}
.btn:disabled{opacity:.45;cursor:not-allowed;border-color:var(--border);color:var(--muted)}
.btn.sm{padding:5px 10px;font-size:12.5px;border-radius:7px}

/* ---------- upload (sidebar) ---------- */
#drop{
  border:2px dashed var(--border);border-radius:14px;background:var(--surface);
  padding:22px 14px;text-align:center;transition:.18s;cursor:pointer;flex:none;
}
#drop:hover,#drop.over{border-color:var(--accent);background:var(--accent-soft)}
#drop.over{transform:scale(1.01)}
.drop-ico{
  width:38px;height:38px;margin:0 auto 10px;border-radius:11px;
  display:grid;place-items:center;background:var(--accent-soft);color:var(--accent);
}
#drop strong{display:block;font-size:14px;margin-bottom:4px}
#drop span{color:var(--muted);font-size:12px}
.side-opt{
  display:flex;align-items:flex-start;gap:7px;font-size:12.5px;color:var(--muted);
  padding:12px 4px 0;cursor:pointer;line-height:1.4;
}
.side-opt input{accent-color:var(--accent);width:15px;height:15px;cursor:pointer;flex:none;margin-top:1px}
.side-msg{font-size:12.5px;margin:10px 4px 0}
.side-msg:empty{display:none}

/* ---------- settings ---------- */
.settings{
  margin-top:auto;padding:12px 14px;border:1px solid var(--border);
  border-radius:var(--radius);background:var(--surface);text-align:left;flex:none;
}
.settings summary{cursor:pointer;font-size:12.5px;color:var(--muted);font-weight:500}
.settings summary:hover{color:var(--text)}
.settings .row{display:flex;gap:8px;margin-top:12px}
.settings input{
  flex:1;padding:8px 11px;border:1px solid var(--border);border-radius:8px;
  background:var(--bg);color:var(--text);font:13px ui-monospace,Consolas,monospace;
}
.settings input:focus{outline:2px solid var(--accent);outline-offset:-1px;border-color:transparent}
.hint{font-size:12px;color:var(--muted);margin:9px 0 0}

/* ---------- workspace ---------- */
.work{flex:1;display:grid;grid-template-columns:300px 1fr;min-height:0}
aside{
  background:var(--surface);border-right:1px solid var(--border);
  padding:16px;overflow:auto;display:flex;flex-direction:column;gap:4px;
}
.aside-h{
  font-size:11px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;
  color:var(--muted);padding:20px 4px 9px;
}
.doc-item{
  width:100%;text-align:left;border:1px solid transparent;background:transparent;
  padding:9px 10px;border-radius:9px;margin-bottom:3px;transition:.13s;
}
.doc-item:hover{background:var(--surface-2)}
.doc-item.active{background:var(--accent-soft);border-color:var(--accent)}
.doc-item .nm{
  font-size:13px;font-weight:500;white-space:nowrap;overflow:hidden;
  text-overflow:ellipsis;display:block;
}
.doc-item .mt{font-size:11.5px;color:var(--muted);display:block;margin-top:2px}

main{overflow:auto;padding:20px 24px;min-width:0}
.empty-state{
  height:100%;display:grid;place-items:center;text-align:center;color:var(--muted);
  padding:40px 20px;
}
.empty-state .ico{
  width:52px;height:52px;margin:0 auto 16px;border-radius:14px;
  display:grid;place-items:center;background:var(--accent-soft);color:var(--accent);
}
.empty-state strong{display:block;font-size:16.5px;color:var(--text);margin-bottom:5px}
.empty-state p{margin:0;font-size:13.5px;max-width:320px}

.doc-head{display:flex;flex-wrap:wrap;align-items:center;gap:12px;margin-bottom:6px}
.doc-head h2{font-size:19px;word-break:break-all}
.meta{display:flex;flex-wrap:wrap;gap:7px;margin:10px 0 18px}
.tag{
  font-size:12px;padding:3px 9px;border-radius:999px;
  background:var(--surface-2);border:1px solid var(--border);color:var(--muted);
}
.tag.ok{background:var(--ok-soft);border-color:transparent;color:var(--ok);font-weight:500}
.tag.warn{background:var(--warn-soft);border-color:transparent;color:var(--warn);font-weight:500}
.tag.err{background:var(--err-soft);border-color:transparent;color:var(--err);font-weight:500}
.actions{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:18px}

/* ---------- progress ---------- */
.prog{
  background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);
  padding:20px;box-shadow:var(--shadow);
}
.prog .lbl{display:flex;justify-content:space-between;font-size:13.5px;margin-bottom:10px}
.prog .lbl b{font-weight:500}
.prog .lbl span{color:var(--muted)}
.bar{height:6px;background:var(--border);border-radius:99px;overflow:hidden}
.bar i{
  display:block;height:100%;background:var(--accent);border-radius:99px;
  transition:width .35s ease;
}
.spin{
  width:14px;height:14px;border:2px solid var(--border);border-top-color:var(--accent);
  border-radius:50%;animation:sp .7s linear infinite;display:inline-block;vertical-align:-2px;
}
@keyframes sp{to{transform:rotate(360deg)}}

/* ---------- results ---------- */
.panes{display:grid;grid-template-columns:1fr 1fr;gap:18px;align-items:start}
.pane{
  background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);
  box-shadow:var(--shadow);overflow:hidden;display:flex;flex-direction:column;
}
.pane-h{
  display:flex;align-items:center;gap:8px;padding:10px 14px;
  border-bottom:1px solid var(--border);background:var(--surface-2);flex:none;
}
.pane-h h3{font-size:13px;font-weight:600}
.pane-h .spacer{flex:1}
.pane iframe{width:100%;height:calc(100vh - 290px);min-height:440px;border:0;background:#fff}

.tabs{display:flex;gap:2px}
.tab{
  border:0;background:transparent;padding:5px 11px;border-radius:7px;
  font-size:12.5px;color:var(--muted);font-weight:500;
}
.tab:hover{background:var(--border)}
.tab.on{background:var(--accent);color:#fff}
.tab-body{overflow:auto;height:calc(100vh - 290px);min-height:440px;padding:0}

.page-block{border-bottom:1px solid var(--border)}
.page-block:last-child{border-bottom:0}
.page-bar{
  display:flex;align-items:center;gap:9px;padding:8px 14px;
  background:var(--surface-2);position:sticky;top:0;z-index:1;
  border-bottom:1px solid var(--border);
}
.page-bar .n{font-size:12px;font-weight:600;color:var(--muted);letter-spacing:.03em}
.page-bar .spacer{flex:1}
.page-block pre{
  margin:0;padding:14px 16px;white-space:pre-wrap;word-break:break-word;
  font:12.5px/1.65 ui-monospace,"Cascadia Code",Consolas,monospace;tab-size:4;
}
.page-block pre.empty{color:var(--muted);font-style:italic}

table.kv{width:100%;border-collapse:collapse;font-size:13px}
table.kv td{padding:8px 16px;border-bottom:1px solid var(--border)}
table.kv td:first-child{color:var(--muted);width:45%}
table.kv td:last-child{font-family:ui-monospace,Consolas,monospace;font-size:12.5px}

.banner{
  display:flex;gap:10px;align-items:flex-start;padding:12px 14px;
  border-radius:10px;font-size:13.5px;margin-bottom:16px;
}
.banner.info{background:var(--accent-soft);color:var(--accent)}
.banner.err{background:var(--err-soft);color:var(--err)}
.banner b{display:block;margin-bottom:2px}

@media (max-width:1080px){
  .panes{grid-template-columns:1fr}
  .pane iframe,.tab-body{height:60vh}
}
@media (max-width:760px){
  .work{grid-template-columns:1fr;grid-template-rows:auto 1fr}
  aside{border-right:0;border-bottom:1px solid var(--border);max-height:44vh}
  main{padding:16px}
}
</style>
</head>
<body>
<div class="app">

<header>
  <img class="logo" src="next_logo.png" alt="NEXT OCR">
  <div class="brand">
    <h1>NEXT OCR</h1>
    <p>Reconnaissance de texte automatique</p>
  </div>
  <div class="spacer"></div>
</header>

<div class="work" id="view-work">
  <aside>
    <div id="drop" tabindex="0" role="button" aria-label="Déposer un document">
      <div class="drop-ico">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
          <path d="M7 10l5-5 5 5"/><path d="M12 5v13"/>
        </svg>
      </div>
      <strong>Déposez vos documents</strong>
      <span>PDF, JPG, PNG, TIFF — ou cliquez</span>
    </div>
    <input type="file" id="file" accept=".pdf,image/*" multiple hidden>

    <label class="side-opt">
      <input type="checkbox" id="opt-force">
      Forcer l'OCR sur les PDF déjà textuels
    </label>

    <p class="side-msg" id="landing-msg"></p>

    <div class="aside-h">Documents</div>
    <div id="doclist"></div>

    <details class="settings" id="settings">
      <summary>⚙ Configuration du service OCR</summary>
      <div class="row">
        <input type="url" id="hook" placeholder="https://votre-serveur/api/ocr" spellcheck="false">
        <button class="btn sm" id="hook-save">Enregistrer</button>
      </div>
      <p class="hint">URL du point d'accès de traitement OCR.
        Enregistrée dans ce navigateur uniquement.</p>
    </details>
  </aside>
  <main id="detail"></main>
</div>

</div>

<script>
/* ============================================================
   Configuration
   ============================================================ */
const WEBHOOK_URL = 'http://localhost:5678/webhook/ocr';   // point d'accès de traitement OCR
const TARGET_WIDTH  = 1600;       // largeur de rendu des pages (px)
const MAX_BYTES     = 950 * 1024; // marge sous la limite d'envoi de 1 Mo
const NATIVE_MIN_CHARS = 120;     // seuil de détection d'une couche texte existante

const $ = s => document.querySelector(s);
const hookUrl = () => (localStorage.getItem('ocrHook') || WEBHOOK_URL).trim();

/* ---------- pdf.js : worker via blob (fonctionne aussi en file://) ---------- */
const WORKER_SRC = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
let workerReady = fetch(WORKER_SRC)
  .then(r => r.blob())
  .then(b => { pdfjsLib.GlobalWorkerOptions.workerSrc = URL.createObjectURL(b); })
  .catch(() => { pdfjsLib.GlobalWorkerOptions.workerSrc = WORKER_SRC; });

/* ============================================================
   État
   ============================================================ */
const docs = [];      // {id,name,size,native,pages[],tab,pdfUrl,error}
let activeId = null;
let busy = false;

/* ============================================================
   Rendu d'une page en JPEG sous la limite de taille
   ------------------------------------------------------------
   Réduit qualité puis échelle jusqu'à passer sous MAX_BYTES.
   Renvoie une data URL — le préfixe `data:image/jpeg;base64,`
   est requis par l'API du service OCR.
   ============================================================ */
function canvasToJpeg(canvas) {
  for (const q of [0.82, 0.70, 0.58, 0.45]) {
    const url = canvas.toDataURL('image/jpeg', q);
    if (b64Bytes(url) <= MAX_BYTES) return url;
  }
  // dernier recours : on divise les dimensions par deux
  const half = document.createElement('canvas');
  half.width = Math.round(canvas.width / 2);
  half.height = Math.round(canvas.height / 2);
  const c = half.getContext('2d');
  c.fillStyle = '#fff'; c.fillRect(0, 0, half.width, half.height);
  c.drawImage(canvas, 0, 0, half.width, half.height);
  return half.toDataURL('image/jpeg', 0.7);
}
function b64Bytes(dataUrl) {
  const b64 = dataUrl.slice(dataUrl.indexOf(',') + 1);
  const pad = (b64.endsWith('==') ? 2 : b64.endsWith('=') ? 1 : 0);
  return Math.floor(b64.length * 3 / 4) - pad;
}

async function renderPdfPage(pdf, n, extraRotation = 0) {
  const page = await pdf.getPage(n);
  const rot = (page.rotate + extraRotation) % 360;
  const base = page.getViewport({ scale: 1, rotation: rot });
  const scale = Math.min(TARGET_WIDTH / base.width, 3);
  const vp = page.getViewport({ scale, rotation: rot });
  const canvas = document.createElement('canvas');
  canvas.width = Math.ceil(vp.width);
  canvas.height = Math.ceil(vp.height);
  const ctx = canvas.getContext('2d');
  ctx.fillStyle = '#fff';                       // JPEG n'a pas d'alpha
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  await page.render({ canvasContext: ctx, viewport: vp }).promise;
  return canvasToJpeg(canvas);
}

async function renderImageFile(file, extraRotation = 0) {
  const bmp = await createImageBitmap(file);
  const turned = extraRotation % 180 !== 0;
  const scale = Math.min(TARGET_WIDTH / (turned ? bmp.height : bmp.width), 3);
  const w = Math.ceil((turned ? bmp.height : bmp.width) * scale);
  const h = Math.ceil((turned ? bmp.width : bmp.height) * scale);
  const canvas = document.createElement('canvas');
  canvas.width = w; canvas.height = h;
  const ctx = canvas.getContext('2d');
  ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, w, h);
  ctx.translate(w / 2, h / 2);
  ctx.rotate(extraRotation * Math.PI / 180);
  ctx.drawImage(bmp, -bmp.width * scale / 2, -bmp.height * scale / 2,
                bmp.width * scale, bmp.height * scale);
  return canvasToJpeg(canvas);
}

/* ============================================================
   Appel du service OCR
   ============================================================ */
async function ocrPage(filename, pageNo, imageBase64) {
  const url = hookUrl();
  if (!url) throw new Error("Aucune URL de service OCR configurée.");
  const t0 = performance.now();
  const res = await fetch(url, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ filename, page: pageNo, imageBase64 }),
  });
  if (!res.ok) throw new Error(`Le service OCR a répondu ${res.status} ${res.statusText}`);
  const data = await res.json();
  if (!data.ok) throw new Error(data.error || 'Erreur OCR inconnue.');
  // JVBER = « %PDF » en base64. Sans ce contrôle, une charge utile invalide ne
  // se manifeste qu'à la fusion, sous forme d'une erreur pdf-lib incompréhensible
  // (« No PDF header found ») qui désigne le mauvais coupable.
  if (!/^JVBER/.test(data.pdfBase64 || '')) {
    throw new Error(
      "Le service OCR n'a pas renvoyé de PDF — reçu « " +
      String(data.pdfBase64 ?? 'rien').slice(0, 20) +
      " ». Le workflow n8n publié est probablement une version obsolète " +
      '(voir « Réimporter après modification » dans le README).');
  }
  data.roundTripMs = Math.round(performance.now() - t0);
  data.sentBytes = b64Bytes(imageBase64);
  return data;
}

/* ============================================================
   Traitement d'un document
   ============================================================ */
async function handleFiles(fileList) {
  const files = [...fileList];
  if (!files.length) return;
  if (!hookUrl()) {
    $('#landing-msg').innerHTML =
      '<span style="color:var(--err)">Configurez d\'abord l\'URL du service OCR ci-dessous.</span>';
    $('#settings').open = true;
    $('#hook').focus();
    return;
  }
  await workerReady;
  for (const f of files) await processFile(f);
}

async function processFile(file) {
  const doc = {
    id: crypto.randomUUID(), name: file.name, size: file.size,
    file, pages: [], native: false, tab: 'text', pdfUrl: null,
    status: 'working', error: null, startedAt: performance.now(),
  };
  docs.push(doc);
  if (!activeId) activeId = doc.id;
  busy = true; render();

  try {
    const isPdf = /\.pdf$/i.test(file.name) || file.type === 'application/pdf';
    if (isPdf) await processPdf(doc, file);
    else await processImage(doc, file);
    doc.status = 'done';
  } catch (e) {
    doc.status = 'error';
    doc.error = e.message;
  }
  doc.elapsed = Math.round(performance.now() - doc.startedAt);
  busy = docs.some(d => d.status === 'working');
  await rebuildPdf(doc);
  render();
}

async function processPdf(doc, file) {
  const buf = await file.arrayBuffer();
  const pdf = await pdfjsLib.getDocument({ data: buf.slice(0) }).promise;
  doc.pdf = pdf;
  doc.pageCount = pdf.numPages;

  // Le PDF possède-t-il déjà une couche texte ?
  const native = await detectNativeText(pdf);
  doc.nativeChars = native.chars;

  if (native.isNative && !$('#opt-force').checked) {
    // Déjà consultable : on n'appelle pas l'OCR, on lit la couche texte.
    doc.native = true;
    doc.pages = native.texts.map((t, i) => ({
      n: i + 1, text: t, rotation: 0, source: 'native', status: 'done',
    }));
    doc.originalBlob = new Blob([buf], { type: 'application/pdf' });
    render();
    return;
  }

  for (let n = 1; n <= pdf.numPages; n++) {
    doc.pages.push({ n, rotation: 0, status: 'working', text: '', source: 'ocr' });
    render();
    await runPage(doc, doc.pages[n - 1]);
  }
}

async function processImage(doc, file) {
  doc.pageCount = 1;
  doc.pages.push({ n: 1, rotation: 0, status: 'working', text: '', source: 'ocr' });
  render();
  await runPage(doc, doc.pages[0]);
}

/** OCR (ou ré-OCR) d'une page, en tenant compte de sa rotation courante. */
async function runPage(doc, page) {
  page.status = 'working';
  page.error = null;
  render();
  try {
    const img = doc.pdf
      ? await renderPdfPage(doc.pdf, page.n, page.rotation)
      : await renderImageFile(doc.file, page.rotation);
    const r = await ocrPage(doc.name, page.n, img);
    Object.assign(page, {
      text: (r.text || '').trim(), pdfBase64: r.pdfBase64,
      ms: r.ms, roundTripMs: r.roundTripMs, sentBytes: r.sentBytes,
      exitCode: r.exitCode, status: 'done',
    });
  } catch (e) {
    page.status = 'error';
    page.error = e.message;
  }
  render();
}

async function detectNativeText(pdf) {
  const texts = [];
  let chars = 0;
  for (let n = 1; n <= pdf.numPages; n++) {
    const tc = await (await pdf.getPage(n)).getTextContent();
    const t = tc.items.map(i => i.str).join(' ').replace(/\s+/g, ' ').trim();
    texts.push(t);
    chars += t.length;
  }
  return { isNative: chars >= NATIVE_MIN_CHARS, chars, texts };
}

/** Fusionne les PDF consultables page par page en un seul fichier. */
async function rebuildPdf(doc) {
  if (doc.pdfUrl) { URL.revokeObjectURL(doc.pdfUrl); doc.pdfUrl = null; }
  try {
    if (doc.native && doc.originalBlob) {          // déjà consultable tel quel
      doc.pdfUrl = URL.createObjectURL(doc.originalBlob);
      return;
    }
    const parts = doc.pages.filter(p => p.pdfBase64).map(p => p.pdfBase64);
    if (!parts.length) return;
    if (parts.length === 1) {
      doc.pdfUrl = URL.createObjectURL(b64ToBlob(parts[0]));
      return;
    }
    const out = await PDFLib.PDFDocument.create();
    for (const b64 of parts) {
      const src = await PDFLib.PDFDocument.load(b64);
      (await out.copyPages(src, src.getPageIndices())).forEach(p => out.addPage(p));
    }
    doc.pdfUrl = URL.createObjectURL(
      new Blob([await out.save()], { type: 'application/pdf' }));
  } catch (e) {
    doc.mergeError = e.message;
  }
}

function b64ToBlob(b64, type = 'application/pdf') {
  const bin = atob(b64);
  const arr = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
  return new Blob([arr], { type });
}

function fullText(doc) {
  return doc.pages
    .map(p => `----- Page ${p.n} -----\n\n${p.text || '(aucun texte)'}`)
    .join('\n\n');
}

/* ============================================================
   Rendu de l'interface
   ============================================================ */
const esc = s => String(s ?? '').replace(/[&<>"]/g,
  c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const kb = b => b >= 1048576 ? (b / 1048576).toFixed(1) + ' Mo' : Math.round(b / 1024) + ' Ko';
const secs = ms => (ms / 1000).toFixed(1).replace('.', ',') + ' s';

function render() {
  renderList();
  renderDetail();
}

function renderList() {
  if (!docs.length) {
    $('#doclist').innerHTML = `<p style="padding:0 8px;font-size:12.5px;color:var(--muted)">Aucun document pour l'instant.</p>`;
    return;
  }
  $('#doclist').innerHTML = docs.map(d => `
    <button class="doc-item ${d.id === activeId ? 'active' : ''}" data-doc="${d.id}">
      <span class="nm">${esc(d.name)}</span>
      <span class="mt">${d.status === 'working'
        ? 'traitement…'
        : d.status === 'error' ? 'échec'
        : `${d.pages.length} page${d.pages.length > 1 ? 's' : ''}${d.native ? ' · natif' : ''}`}</span>
    </button>`).join('');
}

function renderDetail() {
  const d = docs.find(x => x.id === activeId);
  if (!d) {
    $('#detail').innerHTML = `
      <div class="empty-state">
        <div>
          <div class="ico">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                 stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
              <path d="M14 2v6h6"/>
            </svg>
          </div>
          <strong>Aucun document sélectionné</strong>
          <p>Déposez un PDF ou une image à gauche pour lancer la reconnaissance de texte.</p>
        </div>
      </div>`;
    return;
  }

  const done = d.pages.filter(p => p.status === 'done').length;
  const failed = d.pages.filter(p => p.status === 'error').length;
  const total = d.pageCount || d.pages.length || 1;

  const tags = [
    `<span class="tag">${kb(d.size)}</span>`,
    `<span class="tag">${total} page${total > 1 ? 's' : ''}</span>`,
    d.native
      ? `<span class="tag ok">Texte natif — déjà consultable</span>`
      : `<span class="tag">OCR</span>`,
    d.elapsed ? `<span class="tag">${secs(d.elapsed)}</span>` : '',
    failed ? `<span class="tag err">${failed} page(s) en échec</span>` : '',
  ].join('');

  const working = d.status === 'working';

  $('#detail').innerHTML = `
    <div class="doc-head"><h2>${esc(d.name)}</h2></div>
    <div class="meta">${tags}</div>

    ${d.error ? `<div class="banner err"><div><b>Le traitement a échoué</b>${esc(d.error)}</div></div>` : ''}

    ${d.native ? `<div class="banner info"><div><b>Aucun OCR nécessaire</b>
      Ce PDF contient déjà une couche texte (${d.nativeChars} caractères) : son contenu est
      sélectionnable tel quel. Cochez « Forcer l'OCR » pour le passer quand même par l'OCR.
      </div></div>` : ''}

    ${working ? `
      <div class="prog">
        <div class="lbl">
          <b><span class="spin"></span> Analyse en cours…</b>
          <span>page ${Math.min(done + 1, total)} sur ${total}</span>
        </div>
        <div class="bar"><i style="width:${Math.round(done / total * 100)}%"></i></div>
      </div>` : `
      <div class="actions">
        <button class="btn primary" data-act="dl-pdf" ${d.pdfUrl ? '' : 'disabled'}>
          ⬇ PDF consultable</button>
        <button class="btn" data-act="dl-txt">⬇ Texte brut (.txt)</button>
        <button class="btn ghost" data-act="copy">Copier le texte</button>
      </div>`}

    ${d.pages.length ? renderPanes(d) : ''}
  `;
}

function renderPanes(d) {
  return `
  <div class="panes">
    <div class="pane">
      <div class="pane-h"><h3>Document</h3><div class="spacer"></div>
        <span class="tag">texte sélectionnable</span></div>
      ${d.pdfUrl
        ? `<iframe src="${d.pdfUrl}" title="PDF consultable"></iframe>`
        : `<div style="padding:40px;text-align:center;color:var(--muted);font-size:13.5px">
             ${d.mergeError ? 'Fusion impossible : ' + esc(d.mergeError) : 'PDF en préparation…'}</div>`}
    </div>

    <div class="pane">
      <div class="pane-h">
        <div class="tabs">
          <button class="tab ${d.tab === 'text' ? 'on' : ''}" data-tab="text">Texte brut</button>
          <button class="tab ${d.tab === 'info' ? 'on' : ''}" data-tab="info">Détails</button>
        </div>
      </div>
      <div class="tab-body">${d.tab === 'text' ? renderText(d) : renderInfo(d)}</div>
    </div>
  </div>`;
}

function renderText(d) {
  return d.pages.map(p => `
    <div class="page-block">
      <div class="page-bar">
        <span class="n">PAGE ${p.n}</span>
        ${p.status === 'working' ? '<span class="spin"></span>' : ''}
        ${p.status === 'error' ? `<span class="tag err">${esc(p.error)}</span>` : ''}
        ${p.rotation ? `<span class="tag">pivotée ${p.rotation}°</span>` : ''}
        <div class="spacer"></div>
        ${p.source === 'ocr' && p.status !== 'working' ? `
          <button class="btn sm ghost" data-rotate="${p.n}" title="Pivoter de 90° et relancer l'OCR">
            ⟳ Pivoter</button>` : ''}
      </div>
      ${p.status === 'working'
        ? '<pre class="empty">Analyse…</pre>'
        : `<pre${p.text ? '' : ' class="empty"'}>${esc(p.text || 'Aucun texte détecté sur cette page.')}</pre>`}
    </div>`).join('');
}

function renderInfo(d) {
  const rows = [
    ['Fichier', d.name],
    ['Taille', kb(d.size)],
    ['Pages', d.pageCount],
    ['Méthode', d.native ? 'Couche texte native (aucun appel OCR)' : 'OCR'],
    ['Durée totale', d.elapsed ? secs(d.elapsed) : '—'],
  ];
  if (!d.native) {
    d.pages.forEach(p => rows.push([
      `Page ${p.n}`,
      p.status === 'error' ? `échec — ${p.error}`
        : `${p.sentBytes ? kb(p.sentBytes) + ' envoyés · ' : ''}${p.ms ?? '?'} ms OCR · ` +
          `${p.roundTripMs ?? '?'} ms aller-retour${p.rotation ? ` · pivotée ${p.rotation}°` : ''}`,
    ]));
  }
  return `<table class="kv">${rows.map(([k, v]) =>
    `<tr><td>${esc(k)}</td><td>${esc(v)}</td></tr>`).join('')}</table>`;
}

/* ============================================================
   Événements
   ============================================================ */
const drop = $('#drop');
drop.onclick = () => $('#file').click();
drop.onkeydown = e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); $('#file').click(); } };
$('#file').onchange = e => handleFiles(e.target.files);

['dragenter', 'dragover'].forEach(ev =>
  drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.add('over'); }));
['dragleave', 'drop'].forEach(ev =>
  drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.remove('over'); }));
drop.addEventListener('drop', e => handleFiles(e.dataTransfer.files));
// évite qu'un fichier lâché à côté de la zone ouvre le navigateur
['dragover', 'drop'].forEach(ev =>
  window.addEventListener(ev, e => { if (!drop.contains(e.target)) e.preventDefault(); }));

$('#hook').value = localStorage.getItem('ocrHook') || WEBHOOK_URL;
$('#hook-save').onclick = () => {
  localStorage.setItem('ocrHook', $('#hook').value.trim());
  $('#landing-msg').innerHTML = '<span style="color:var(--ok)">Service OCR enregistré.</span>';
};
if (!hookUrl()) $('#settings').open = true;
render();

document.addEventListener('click', async e => {
  const d = docs.find(x => x.id === activeId);

  const pick = e.target.closest('[data-doc]');
  if (pick) { activeId = pick.dataset.doc; return render(); }

  const tab = e.target.closest('[data-tab]');
  if (tab && d) { d.tab = tab.dataset.tab; return render(); }

  const rot = e.target.closest('[data-rotate]');
  if (rot && d && !busy) {
    const page = d.pages.find(p => p.n === +rot.dataset.rotate);
    page.rotation = (page.rotation + 90) % 360;
    busy = true; render();
    await runPage(d, page);
    busy = false;
    await rebuildPdf(d);
    return render();
  }

  const act = e.target.closest('[data-act]')?.dataset.act;
  if (!act || !d) return;
  if (act === 'dl-pdf' && d.pdfUrl) {
    download(d.pdfUrl, d.name.replace(/\.[^.]+$/, '') + '-consultable.pdf');
  } else if (act === 'dl-txt') {
    const url = URL.createObjectURL(new Blob([fullText(d)], { type: 'text/plain;charset=utf-8' }));
    download(url, d.name.replace(/\.[^.]+$/, '') + '.txt');
    setTimeout(() => URL.revokeObjectURL(url), 2000);
  } else if (act === 'copy') {
    await navigator.clipboard.writeText(fullText(d));
    e.target.textContent = '✓ Copié';
    setTimeout(() => { e.target.textContent = 'Copier le texte'; }, 1600);
  }
});

function download(url, name) {
  const a = document.createElement('a');
  a.href = url; a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
}

/* ============================================================
   Auto-test — ouvrir index.html?selftest=1
   Vérifie les deux morceaux non triviaux : le plafonnement de
   taille JPEG et la fusion multi-pages.
   ============================================================ */
if (new URLSearchParams(location.search).has('selftest')) (async () => {
  const ok = (c, m) => console[c ? 'log' : 'error'](c ? '✓' : '✗ ÉCHEC', m);

  // 1. b64Bytes correspond à la taille réelle décodée
  const probe = document.createElement('canvas');
  probe.width = probe.height = 64;
  const pctx = probe.getContext('2d');
  pctx.fillStyle = '#c33'; pctx.fillRect(0, 0, 64, 64);
  const url = probe.toDataURL('image/jpeg', 0.8);
  ok(b64Bytes(url) === b64ToBlob(url.split(',')[1], 'image/jpeg').size,
     'b64Bytes = taille décodée réelle');

  // 2. canvasToJpeg reste sous MAX_BYTES même sur du bruit incompressible
  const big = document.createElement('canvas');
  big.width = big.height = 2600;
  const bctx = big.getContext('2d');
  const img = bctx.createImageData(2600, 2600);
  for (let i = 0; i < img.data.length; i++) img.data[i] = (Math.random() * 255) | 0;
  bctx.putImageData(img, 0, 0);
  const jpeg = canvasToJpeg(big);
  ok(b64Bytes(jpeg) <= MAX_BYTES,
     `canvasToJpeg plafonne le bruit à ${kb(b64Bytes(jpeg))} (max ${kb(MAX_BYTES)})`);

  // 3. la fusion produit bien la somme des pages
  const mk = async n => {
    const p = await PDFLib.PDFDocument.create();
    for (let i = 0; i < n; i++) p.addPage([200, 200]);
    return p.saveAsBase64();
  };
  const doc = { pages: [{ pdfBase64: await mk(3) }, { pdfBase64: await mk(2) }] };
  await rebuildPdf(doc);
  const merged = await PDFLib.PDFDocument.load(await (await fetch(doc.pdfUrl)).arrayBuffer());
  ok(merged.getPageCount() === 5, `fusion 3+2 pages = ${merged.getPageCount()} (attendu 5)`);

  console.log('Auto-test terminé.');
})();
</script>
</body>
</html>
